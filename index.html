    <style>
      body, html {
        background-color: #0F172A;
        color: #F1F5F9;
        font-family: 'Hind Siliguri', 'Noto Sans Bengali', system-ui, -apple-system, sans-serif;
        margin: 0;
        padding: 0;
      }
      button, input, select, textarea {
        font-family: inherit;
        box-sizing: border-box;
      }
    </style>
    <script>
      // Self-healing: Automatically clear stale PWA/ServiceWorker cache if assets fail to load
      window.addEventListener('error', function (e) {
        if (e.target && (e.target.tagName === 'LINK' || e.target.tagName === 'SCRIPT')) {
          console.warn('[Asset Error] Failed loading asset:', e.target.src || e.target.href);
          if ('serviceWorker' in navigator && !sessionStorage.getItem('_sw_recovered')) {
            sessionStorage.setItem('_sw_recovered', 'true');
            navigator.serviceWorker.getRegistrations().then(function (registrations) {
              for (let reg of registrations) reg.unregister();
              if ('caches' in window) {
                caches.keys().then(function (names) {
                  for (let name of names) caches.delete(name);
                  window.location.reload();
                });
              } else {
                window.location.reload();
              }
            });
          }
        }
      }, true);
    </script>
    <script id="google-gsi-client" src="https://accounts.google.com/gsi/client" async defer></script>
</head>
  <body class="bg-[#0F172A]">

</body>
